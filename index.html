<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zlab" />
    <title>Zlab</title>
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      #load-fallback {
        color: #000;
      }
      @media (prefers-color-scheme: dark) {
        #load-fallback {
          color: #fff;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <noscript><p>Zlab needs JavaScript to run. Enable JavaScript and reload the page.</p></noscript>
    <div id="load-fallback" hidden>
      <p>Zlab could not load. Check your connection and <button type="button" id="load-fallback-reload">reload the page</button>.</p>
    </div>
    <div id="toast-root"></div>
    <script type="module" src="/src/main.ts" defer></script>
    <script>
      (function () {
        var root = document.getElementById("root")
        var fallback = document.getElementById("load-fallback")
        document.getElementById("load-fallback-reload").addEventListener("click", function () {
          location.reload()
        })
        var timer = setTimeout(function () {
          if (root.childElementCount === 0) fallback.hidden = false
        }, 8000)
        var observer = new MutationObserver(function () {
          if (root.childElementCount > 0) {
            clearTimeout(timer)
            fallback.hidden = true
            observer.disconnect()
          }
        })
        observer.observe(root, { childList: true })
      })()
    </script>
  </body>
</html>
